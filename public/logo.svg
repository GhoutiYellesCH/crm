<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path
    d="M 50 12 L 82 22 C 82 52, 68 76, 50 88 C 32 76, 18 52, 18 22 Z"
    fill="#090d16"
    stroke="url(#shieldGrad)"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Inner Circuit Shield -->
  <path
    d="M 50 19 L 76 27 C 76 50, 64 69, 50 79 C 36 69, 24 50, 24 27 Z"
    fill="#040711"
    stroke="url(#glowGrad)"
    stroke-width="1.2"
    stroke-opacity="0.5"
    stroke-linejoin="round"
  />

  <!-- Interconnected Flow Network -->
  <g filter="url(#neon)">
    <!-- Circuit lines -->
    <path d="M 50 30 L 35 52 L 50 68 L 65 52 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 50 30 L 50 68" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2 2" />
    <path d="M 35 52 L 65 52" fill="none" stroke="#c084fc" stroke-width="1.5" />

    <!-- Core Nodes -->
    <circle cx="50" cy="30" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
    <circle cx="35" cy="52" r="3.5" fill="#818cf8" stroke="#ffffff" stroke-width="1" />
    <circle cx="65" cy="52" r="3.5" fill="#a855f7" stroke="#ffffff" stroke-width="1" />
    <circle cx="50" cy="68" r="4.5" fill="#06b6d4" stroke="#ffffff" stroke-width="1.2" />
  </g>
</svg>